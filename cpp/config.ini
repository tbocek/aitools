[Qwen3.6 Summarize (35B-A3B; 128k ctx; no-think; Q4_K_XL)]
# url = https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
model = /mnt/models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
# text-only on purpose: summarizing needs no vision, skipping mmproj saves the
# projector VRAM and load time
# Qwen3.6 is a hybrid-thinking model; the chat template honors enable_thinking,
# so this disables the <think> phase entirely rather than truncating it
chat-template-kwargs = {"enable_thinking": false}
parallel = 2
ctx-size = 131072
spec-type = draft-mtp
spec-draft-n-max = 3

