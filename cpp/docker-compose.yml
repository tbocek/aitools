services:
  llama:
    build:
      context: .
      dockerfile: Dockerfile.llama
    image: llama:latest
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - render
      - video
    security_opt:
      - seccomp=unconfined
    environment:
      - CUDA_VISIBLE_DEVICES=${LLAMA_DEVICE:-1}
      - GGML_VK_VISIBLE_DEVICES=${LLAMA_DEVICE:-1}
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /mnt/models:/mnt/models
      - /tmp:/tmp
    command: /home/arch/llama.cpp.${LLAMA_BACKEND:-vulkan}/build/bin/llama-server --models-preset /mnt/models/config.ini --models-max 1 --parallel 1 --host 0.0.0.0 --port 9001
  sd:
    build:
      context: .
      dockerfile: Dockerfile.sd
    image: sd:latest
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - render
      - video
    security_opt:
      - seccomp=unconfined
    environment:
      - CUDA_VISIBLE_DEVICES=${SD_DEVICE:-1}
      - GGML_VK_VISIBLE_DEVICES=${SD_DEVICE:-1}
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - /mnt/models/sd:/home/arch/sd.cpp-webui.${SD_BACKEND:-vulkan}/models
    command: >-
      bash -c "mkdir -p /home/arch/sd.cpp-webui.${SD_BACKEND:-vulkan}/models/{checkpoints,unet,vae,text_encoders,embeddings,loras,taesd,photomaker,upscale_models,controlnet}
      && /home/arch/sd.cpp-webui.${SD_BACKEND:-vulkan}/sdcpp_webui.sh --listen ${SD_ARGS:-}"
