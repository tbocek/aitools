services:
  llama:
    build:
      context: .
      dockerfile: Dockerfile.llama
    image: llama:latest
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - render
      - video
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /mnt/models:/mnt/models
      - /tmp:/tmp
    command: >-
      /home/arch/llama.cpp/build/bin/llama-server
      --device ${LLAMA_DEVICE:-ROCM0}
      --models-preset /mnt/models/config.ini
      --models-max 1
      --host 0.0.0.0
      --port 9001
  sd:
    build:
      context: .
      dockerfile: Dockerfile.sd
    image: sd:latest
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - render
      - video
    security_opt:
      - seccomp=unconfined
    ipc: host
    environment:
      - HIP_VISIBLE_DEVICES=${SD_HIP_VISIBLE-0}
      - GGML_VK_VISIBLE_DEVICES=${SD_VK_VISIBLE-}
    restart: unless-stopped
    ports:
      - "1234:1234"
    volumes:
      - /mnt/models/sd:/mnt/models/sd
    command: >-
      /home/arch/stable-diffusion.cpp/build/bin/sd-server
      --listen-ip 0.0.0.0
      --listen-port 1234
      --diffusion-fa
      --offload-to-cpu
      --steps 10
      --cfg-scale 1.0
      --sampling-method euler
      ${SD_ARGS:-}
  ace:
    build:
      context: .
      dockerfile: Dockerfile.ace-step
    image: ace:latest
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - render
      - video
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - /mnt/models/ace:/mnt/models/ace
    command: >-
      bash -c "export PATH=\"/home/arch/.local/bin:$$PATH\" &&
      if [ ! -f /mnt/models/ace/acestep-5Hz-lm-4B-Q8_0.gguf ]; then
        echo 'Downloading ACE-Step models...' &&
        hf download Serveurperso/ACE-Step-1.5-GGUF Qwen3-Embedding-0.6B-Q8_0.gguf acestep-5Hz-lm-4B-Q8_0.gguf acestep-v15-turbo-Q8_0.gguf vae-BF16.gguf --local-dir /mnt/models/ace;
      fi &&
      /home/arch/acestep.cpp.${ACE_BACKEND:-vulkan}/build/ace-server --models /mnt/models/ace --host 0.0.0.0 --port 8082"
      svan:
          build:
            context: .
            dockerfile: Dockerfile.streamvoiceanon
          image: svan:latest
          devices:
            - /dev/kfd
            - /dev/dri
          group_add:
            - render
            - video
          security_opt:
            - seccomp=unconfined
          ipc: host
          environment:
            - DISPLAY=${DISPLAY}
            - PULSE_SERVER=unix:/run/user/1000/pulse/native
          volumes:
            - /mnt/models/svan:/mnt/models/svan
            - /tmp/.X11-unix:/tmp/.X11-unix
            - ${XDG_RUNTIME_DIR}/pulse:/run/user/1000/pulse
          command: >-
            bash -c "if [ ! -d /mnt/models/svan/ckpt ]; then
              echo 'Downloading StreamVoiceAnon models...' &&
              hf download Plachta/StreamVoiceAnon --local-dir /mnt/models/svan/ckpt;
            fi &&
            ln -sfn /mnt/models/svan/ckpt pretrained_checkpoints &&
            python evaluations/real-time-gui.py"
  vc:
    build:
      context: .
      dockerfile: Dockerfile.vc
    image: vc:latest
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - render
      - video
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    ports:
      - "18888:18888"
    volumes:
      # model_dir must stay RELATIVE: the app mounts static files at
      # f"/{model_dir}", so an absolute path yields a broken "//mnt/..." route
      # and every model icon 404s.
      - /mnt/models/vc:/home/arch/voice-changer/server/model_dir
    command: >-
      python MMVCServerSIO.py
      --host 0.0.0.0
      --port 18888
      --model_dir model_dir
  vc2:
    build:
      context: .
      dockerfile: Dockerfile.vc2
    image: vc2:latest
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - render
      - video
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    ports:
      - "6969:6969"
    environment:
      # Applio's realtime tab drives PortAudio server-side (sounddevice), unlike
      # w-okada which captures in the browser. Without a sound server the device
      # dropdowns are empty, so hand it the host's pipewire-pulse socket.
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    volumes:
      # Applio downloads ~1.9GB of pretraineds/embedders/predictors on first
      # start; without these mounts that happens again on every recreate.
      # logs/ is also where trained models and indexes end up.
      - /mnt/models/applio/models:/home/arch/Applio/rvc/models
      - /mnt/models/applio/logs:/home/arch/Applio/logs
      # Same path inside and out, so the symlinks in logs/ resolve either side.
      - /mnt/models/vc:/mnt/models/vc:ro
      # uid 1000 both on the host and in the arch image, so the socket and
      # cookie land where libpulse already looks for them.
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native
      - /home/draft/.config/pulse/cookie:/home/arch/.config/pulse/cookie:ro
    # -u: gradio/tqdm output is block-buffered through docker's pipe, so without
    # it "docker compose logs vc2" stays empty until the buffer flushes.
    command: >-
      python -u app.py
      --server-name 0.0.0.0
      --port 6969