services:
    llama:
        build:
            context: .
            dockerfile: Dockerfile.llama
        image: llama:latest
        devices:
            - /dev/kfd
            - /dev/dri
        group_add:
            - render
            - video
        environment:
            - CUDA_VISIBLE_DEVICES=${LLAMA_DEVICE:-0}
            - GGML_VK_VISIBLE_DEVICES=${LLAMA_DEVICE:-0}
        restart: unless-stopped
        ports:
            - "9001:9001"
        volumes:
            - /mnt/models:/mnt/models
            - /tmp:/tmp
        command: /home/arch/llama.cpp.${LLAMA_BACKEND:-vulkan}/build/bin/llama-server --models-preset /mnt/models/config.ini --models-max 1 --host 0.0.0.0 --port 9001
